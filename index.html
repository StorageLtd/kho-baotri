<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LTD VIET NAM - Cloud</title>
  <style>
    :root { color-scheme: light; --bg: #f6f7f4; --panel: #ffffff; --ink: #18201d; --muted: #637069; --line: #d9e0dc; --brand: #16664d; --danger: #b93232; font-family: sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh; }
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .content { padding: 24px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); overflow-wrap: break-word; }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; background: var(--brand); color: #fff; }
    .input { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 4px; }
    dialog { padding: 20px; border: none; border-radius: 8px; width: 500px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="app">
    <aside style="background: #12251f; color: #fff; padding: 20px;">
      <h2>LTD VIET NAM</h2>
      <nav>
        <button onclick="switchPage('inventoryPage')">Tổng quan</button><br>
        <button onclick="switchPage('machinesPage')">Máy móc</button><br>
        <button onclick="switchPage('historyPage')">Lịch sử</button>
      </nav>
    </aside>

    <main>
      <section id="inventoryPage" class="content">
        <button class="btn" onclick="openItemDialog()">+ Thêm linh kiện</button>
        <div class="table-wrap">
          <table id="inventoryTable">
            <thead><tr><th>Tên</th><th>Mã</th><th>Thiết bị</th><th>Số lượng</th><th>Thao tác</th></tr></thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
      </section>

      <section id="machinesPage" class="content hidden">
        <button class="btn" onclick="openMachineDialog()">+ Thêm máy</button>
        <div class="table-wrap">
          <table id="machineTable">
            <thead><tr><th>Tên máy</th><th>Nhà cung cấp</th><th>Hành động</th></tr></thead>
            <tbody id="machineListBody"></tbody>
          </table>
        </div>
      </section>

      <section id="historyPage" class="content hidden">
        <button class="btn" onclick="openHistoryDialog()">+ Thêm lịch sử</button>
        <div class="table-wrap">
          <table id="historyTable">
            <thead><tr><th>Ngày</th><th>Máy</th><th>Lỗi</th><th>Xử lý</th></tr></thead>
            <tbody id="historyList"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <dialog id="itemDialog">
    <form id="itemForm">
      <h3>Linh kiện</h3>
      <input type="hidden" id="itemId">
      <input class="input" id="nameInput" placeholder="Tên linh kiện" required><br><br>
      <input class="input" id="skuInput" placeholder="Mã linh kiện" required><br><br>
      <input class="input" id="supplierInput" placeholder="Thiết bị sử dụng" required><br><br>
      <button class="btn" type="submit">Lưu</button>
      <button type="button" onclick="document.getElementById('itemDialog').close()">Hủy</button>
    </form>
  </dialog>

  <script>
    // Logic xử lý Form không dùng method="dialog" để tránh xung đột
    document.getElementById('itemForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Đã lưu linh kiện: ' + document.getElementById('nameInput').value);
      document.getElementById('itemDialog').close();
    });

    function openItemDialog() { document.getElementById('itemDialog').showModal(); }
    function switchPage(id) {
      document.querySelectorAll('.content').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }
  </script>
</body>
</html>
